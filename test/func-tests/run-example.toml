# ==========================================================================
# Functional Test Runner — Central Configuration
# ==========================================================================
#
# Usage:  cd test/func-tests && python3 run.py [--config run.toml] [--suite hardfork-support]
#
# Steps executed:
#   1. Setup environment  (launch skaled(s) and/or anvil)
#   2. Deploy contracts   (per-suite, e.g. hardhat deploy)
#   3. Run tests          (per-suite, web3.py; anvil mode compares outputs)
#   4. Background block-hash comparison (two-node skaled mode)

# --------------------------------------------------------------------------
# Test suite selection
# --------------------------------------------------------------------------
[suite]
# Which test suite to run.  Must match a subdirectory name under func-tests/
# that contains a suite.py with deploy() and run_tests() entry points.
# Available: "hardfork-support", "state-exhaustion"
name = "hardfork-support"

# --------------------------------------------------------------------------
# Environment type
# --------------------------------------------------------------------------
[type]
# "single" — one skaled node
# "two"    — two skaled nodes (connected, block-hash comparison in background)
# "anvil"  — skaled + anvil side-by-side, same tests run on both, outputs compared
env_type = "anvil"

# Base account — must have balance on all nodes (genesis-funded).
# Required for deploying contracts and sending test transactions.
private_key = ""

# Use btrfs loopback volumes for datadirs.
# When true, creates sparse images, formats as btrfs, and mounts before launch.
# When false, datadirs are plain directories (no btrfs features / snapshots).
use_btrfs = false

# --------------------------------------------------------------------------
# skaled configuration
# --------------------------------------------------------------------------
[skaled]
# Path to pre-built skaled binary.  Empty = build from source via cmake.
binary = ""
# Whether to build skaled if binary is missing.
build = true

# Branch to checkout before building (empty = skip checkout).
branch = ""

# Per-node configs.  Keys are node indices (0, 1, …).
# For "single" / "anvil" mode only node 0 is used.
# For "two" mode both 0 and 1 are needed.
[skaled.nodes.0]
config_template = "configs/config-template.json.j2"
config    = "configs/config-loop-0.generated.json"
datadir   = "datadir-loop-0"
http_port = 2234

[skaled.nodes.1]
config_template = "configs/config-template.json.j2"
config    = "configs/config-loop-1.generated.json"
datadir   = "datadir-loop-1"
http_port = 3234

[skaled.template.context]
deployer_permission_storage_key = "0x9340a89d8d6b7a57800bc4eab13bbfcc9bd69ecb9eb2599fe4c37b55917a6323"
deployer_permission_storage_value = "0x01"

# Patch timestamps injected into sChain config before launch.
# Applied to nodes listed in apply_to (empty list = all nodes).
[skaled.patches]
apply_to = []

[skaled.patches.timestamps]
berlinForkPatchTimestamp = 1
pushZeroPatchTimestamp = 1
EIP1559TransactionsPatchTimestamp = 1
singleStateCommitPerBlockPatchTimestamp = 1
flexibleDeploymentPatchTimestamp = 1

# Snapshot settings (for restore before launch; requires use_btrfs = true).
[skaled.snapshot]
interval_sec = 600
# Uncomment to restore from snapshot:
# path   = "/root/17619-bin"
# number = 17619

# --------------------------------------------------------------------------
# Anvil (for "anvil" env_type only)
# --------------------------------------------------------------------------
[anvil]
image      = "ghcr.io/foundry-rs/foundry:rc-3"
container_name = "skaled-func-tests-anvil"
extra_args = []

# --------------------------------------------------------------------------
# Contract deployment (Step 2) — per-suite defaults
# --------------------------------------------------------------------------
[deploy]
# Deploy command (run from the suite's sol/ directory).
# ENDPOINT and PRIVATE_KEY env vars are set automatically.
command = "bun hardhat run scripts/deploy_eip_tests.ts --network custom"

# --------------------------------------------------------------------------
# EIP tests (Step 3) — hardfork-support suite
# --------------------------------------------------------------------------
[eip_tests]
# Number of test iterations (0 = infinite loop until Ctrl-C)
iterations = 1

# Which EIPs to test (empty = all: 2929, 2930, 2718, 2565)
eips = []

# Gas limit for deployment and test transactions
gas_limit = 3000000

# --------------------------------------------------------------------------
# Block-hash comparison (Step 4 — background, "two" mode only)
# --------------------------------------------------------------------------
[hash_check]
# Interval between comparison sweeps (seconds)
interval_sec = 30

# Abort if no new blocks for this many seconds
no_blocks_timeout_sec = 300
