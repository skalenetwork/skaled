[project]
name = "skaled-api-tests"
version = "0.1.0"
description = "API and functional test framework for skaled"
requires-python = ">=3.11"
license = "AGPL-3.0"

dependencies = [
    "web3>=6.0,<8",
    "pytest>7",
    "sgx.py>=0.11",
    "eth-account>=0.10",
    "jinja2>=3.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
]

[project.scripts]
api-test = "run:main"

[tool.uv]
# Pin an absolute cutoff so dependency resolution is deterministic and the
# committed uv.lock stays valid under `uv sync --locked` (CI). Without this the
# lock inherits a *relative* exclude-newer from the developer's global uv config
# (e.g. "7 days"), which drifts daily and differs in environments that lack that
# global setting, breaking `--locked`.
exclude-newer = "2026-06-19T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
