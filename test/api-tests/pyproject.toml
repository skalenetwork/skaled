[project]
name = "skaled-api-tests"
version = "0.1.0"
description = "API and functional test framework for skaled"
requires-python = ">=3.11"
license = "AGPL-3.0"

dependencies = [
    "web3>=6.0,<8",
    "pytest>7",
    "sgx.py>=0.11",
    "eth-account>=0.10",
    "jinja2>=3.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
]

[project.scripts]
api-test = "run:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
