# ==========================================================================
# hardfork-compat suite -- Paris fork replay test parameters
# ==========================================================================
# Merged on top of run.toml at runtime by the test runner.
#
# Purpose: confirm that the current Paris-capable skaled binary can replay a
# chain that starts on the London-capable binary, upgrades before Paris
# activation, and continues after Paris activation without stateRoot or block
# hash divergence.  The final current-version sync node runs with
# syncNode=true and archiveMode=true and compares every block.

# --------------------------------------------------------------------------
# Environment type override
# --------------------------------------------------------------------------
[type]
# "delegated" tells the framework to skip auto-launching any nodes.
# The hardfork-compat suite manages its own primary + sync node lifecycle.
env_type = "delegated"

# --------------------------------------------------------------------------
# Suite configuration
# --------------------------------------------------------------------------
[hardfork_compat]
use_sgx = false

# Binaries to compare (relative to repo root, or absolute).
# By default the suite uses the freshly built current binary as the London
# baseline with Paris disabled, then restarts it with Paris enabled. To test a
# real binary upgrade, point london_binary at a separate London-fork build via:
#   HARDFORK_COMPAT_LONDON_BINARY=/path/to/london/skaled
#   HARDFORK_COMPAT_CURRENT_BINARY=/path/to/current/skaled
# Older HARDFORK_COMPAT_V510_BINARY / HARDFORK_COMPAT_V520_BINARY names remain
# accepted by the fixtures as aliases if these explicit keys are absent.
london_binary  = "build/skaled/skaled"
current_binary = "build/skaled/skaled"

# Ports: primary on 5334, archive sync node on 5344.
primary_http_port = 5334
sync_http_port    = 5344

# --------------------------------------------------------------------------
# Baseline London-era settings injected into the primary config before the
# first launch.  These are not the fork under test; they make the old binary run
# with the London behavior that Paris builds on.
# --------------------------------------------------------------------------
[hardfork_compat.common_patches]
pushZeroPatchTimestamp            = 1
berlinForkPatchTimestamp          = 1
EIP1559TransactionsPatchTimestamp = 1
londonForkPatchTimestamp          = 1
flexibleDeploymentPatchTimestamp  = 1
snapshotIntervalSec               = 0
emptyBlockIntervalMs              = 2000

# --------------------------------------------------------------------------
# Paris timestamp injected only when the primary is restarted on the current
# binary.  It must be in the future at upgrade time so the suite can produce:
#   1. London-binary pre-upgrade workload
#   2. current-binary pre-Paris workload
#   3. current-binary post-Paris workload
# Supports absolute integers and relative expressions: "now", "now+30s",
# "now+5m", etc.  The resolved value is copied to the archive sync config;
# it is not re-resolved for the sync node.
# --------------------------------------------------------------------------
[hardfork_compat.patches]
parisForkPatchTimestamp = "now+90s"

# --------------------------------------------------------------------------
# Timeouts
# --------------------------------------------------------------------------
[hardfork_compat.timeouts]
rpc_up           = 360  # seconds to wait for RPC to become available
block_produce    = 60   # seconds to wait for new blocks after launch
tx_mine          = 120  # seconds to wait for a sent transaction to be mined
paris_activation = 240  # seconds to wait for Paris timestamp to become active
sync_catchup     = 600  # seconds to wait for the archive sync node to catch up
