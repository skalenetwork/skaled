name: api-tests-run
description: Install and run skaled api test suite
inputs:
  suite:
    required: true
    description: "API test suite name (for example: bite compat)"
  build_skaled:
    required: false
    default: "true"
    description: "Whether run.py is allowed to build skaled if binary is missing"
  skaled_binary:
    required: false
    default: ""
    description: "Optional pre-built skaled binary path to inject into run.toml"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - uses: astral-sh/setup-uv@v6

    - name: Sync Python dependencies
      shell: bash
      run: |
        set -euo pipefail
        uv sync --locked --project test/api-tests

    - name: Prepare run.toml and private key
      shell: bash
      run: |
        set -euo pipefail
        cd test/api-tests
        cp run-example.toml run.toml
        if [ -z "${FUNC_TEST_PRIVATE_KEY:-}" ]; then
          echo "::error::Missing required FUNC_TEST_PRIVATE_KEY secret"
          exit 1
        fi
        sed -i "s#^private_key[[:space:]]*=.*#private_key = \"${FUNC_TEST_PRIVATE_KEY}\"#" run.toml

    - name: Apply skaled runner options
      shell: bash
      run: |
        set -euo pipefail
        cd test/api-tests
        awk -v build_val="${{ inputs.build_skaled }}" '
          BEGIN {
            in_skaled = 0
            build_set = 0
          }
          /^\[.*\]$/ {
            if (in_skaled && !build_set) {
              print "build = " build_val
              build_set = 1
            }
            in_skaled = ($0 == "[skaled]")
            print
            next
          }
          {
            if (in_skaled && $0 ~ /^build[[:space:]]*=/) {
              print "build = " build_val
              build_set = 1
              next
            }
            print
          }
          END {
            if (in_skaled && !build_set) {
              print "build = " build_val
            }
          }
        ' run.toml > run.toml.tmp
        mv run.toml.tmp run.toml
        if [ -n "${{ inputs.skaled_binary }}" ]; then
          sed -i "s#^binary[[:space:]]*=.*#binary = \"${{ inputs.skaled_binary }}\"#" run.toml
        fi

    - name: Run API test suite
      shell: bash
      run: |
        set -euo pipefail
        cd test/api-tests
        if ! uv run --project . run.py --config run.toml --suite "${{ inputs.suite }}"; then
          echo "::error::Test execution failed"
          for log in logs/*.log; do
            if [ -f "${log}" ]; then
              echo "::group::${log}"
              cat "${log}"
              echo "::endgroup::"
            fi
          done
          exit 1
        fi
