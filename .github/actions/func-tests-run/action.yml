name: func-tests-run
description: Install and run skaled functional test suite
inputs:
  suite:
    required: true
    description: "Functional test suite name (for example: hardfork-support)"
  build_skaled:
    required: false
    default: "true"
    description: "Whether run.py is allowed to build skaled if binary is missing"
  skaled_binary:
    required: false
    default: ""
    description: "Optional pre-built skaled binary path to inject into run.toml"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - uses: astral-sh/setup-uv@v6

    - shell: bash
      run: |
        set -euo pipefail

        uv sync --locked --project test/func-tests

        cd test/func-tests
        cp run-example.toml run.toml
        sed -i "s#^private_key[[:space:]]*=.*#private_key = \"${FUNC_TEST_PRIVATE_KEY}\"#" run.toml
        sed -i "s#^build[[:space:]]*=.*#build = ${{ inputs.build_skaled }}#" run.toml
        if [ -n "${{ inputs.skaled_binary }}" ]; then
          sed -i "s#^binary[[:space:]]*=.*#binary = \"${{ inputs.skaled_binary }}\"#" run.toml
        fi
        uv run --project . run.py --config run.toml --suite "${{ inputs.suite }}"
