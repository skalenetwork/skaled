name: cmake-build
description: Configure and build a CMake build dir (supports extra cmake args for FAIR/BITE2/HISTORIC)
inputs:
  build_dir:
    required: true
  cmake_build_type:
    required: true
  coverage:
    required: false
    default: ""
  cmake_args:
    required: false
    default: ""
  make_target:
    required: false
    default: testeth

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"

        mkdir -p "${{ inputs.build_dir }}"
        cd "${{ inputs.build_dir }}"

        cmake -DCMAKE_BUILD_TYPE="${{ inputs.cmake_build_type }}" -DCOVERAGE="${{ inputs.coverage }}" ${{ inputs.cmake_args }} ..
        make "${{ inputs.make_target }}" -j"$(nproc)"
