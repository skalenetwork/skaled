name: 'Setup, Build and Publish'
on:
  workflow_call:
    inputs:
      branch_name:
        type: string
        description: 'Branch name'
        required: true
      image_version:
        type: string
        description: 'Image version for docker hub'
        required: true
      cmake_options:
        type: string
        description: 'Additional cmake options'
        required: false
      build_type:
        type: string
        description: 'Build type of skaled binary'
        required: true
      node_type:
        type: string
        description: 'Node type of skaled build'
        required: true
      release_url:
        type: string
        description: 'URL of the GitHub release associated with this build (if applicable)'
        required: false
      use_plain_version:
        type: boolean
        description: 'Use only the image version without appending the build type suffix'
        default: false
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
    outputs:
      version:
        description: "The image version published to DockerHub"
        value: ${{ jobs.main.outputs.version }}
      
jobs:
  main:
    runs-on: self-hosted
    outputs:
      version: ${{ env.VERSION }}
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      BUILD_TYPE: ${{ inputs.build_type }}
      PLAIN_VERSION: ${{ inputs.use_plain_version }}
    steps:
      - name: Prepare workflow variables
        if: inputs.node_type == 'core'
        run: |
          export VERSION_SUFFIX=$(echo "$BUILD_TYPE" | tr '[:upper:]' '[:lower:]')
          [[ $PLAIN_VERSION = "true" ]] && export VERSION=${{ inputs.image_version }} || \
            export VERSION=${{ inputs.image_version }}-$VERSION_SUFFIX
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          export CMAKE_OPTS="${{ inputs.cmake_options }}"
          echo "CMAKE_OPTS=$CMAKE_OPTS" >> $GITHUB_ENV
      - name: Prepare workflow variables (historic)
        if: inputs.node_type == 'historic'
        run: |
          export VERSION_SUFFIX=$(echo "$BUILD_TYPE" | tr '[:upper:]' '[:lower:]')
          [[ $PLAIN_VERSION = "true" ]] && export VERSION=${{ inputs.image_version }} || \
            export VERSION=${{ inputs.image_version }}-$VERSION_SUFFIX-historic
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          export CMAKE_OPTS="-DHISTORIC_STATE=1 ${{ inputs.cmake_options }}"
          echo "CMAKE_OPTS=$CMAKE_OPTS" >> $GITHUB_ENV
      - name: Prepare workflow variables (BITE)
        if: inputs.node_type == 'bite'
        run: |
          export VERSION_SUFFIX=$(echo "$BUILD_TYPE" | tr '[:upper:]' '[:lower:]')
          [[ $PLAIN_VERSION = "true" ]] && export VERSION=${{ inputs.image_version }} || \
            export VERSION=${{ inputs.image_version }}-$VERSION_SUFFIX
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          export CMAKE_OPTS="-DBITE=1 ${{ inputs.cmake_options }}"
          echo "CMAKE_OPTS=$CMAKE_OPTS" >> $GITHUB_ENV
      - name: Prepare workflow variables (BITE-HISTORIC)
        if: inputs.node_type == 'bite-historic'
        run: |
          export VERSION_SUFFIX=$(echo "$BUILD_TYPE" | tr '[:upper:]' '[:lower:]')
          [[ $PLAIN_VERSION = "true" ]] && export VERSION=${{ inputs.image_version }} || \
            export VERSION=${{ inputs.image_version }}-$VERSION_SUFFIX
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          export CMAKE_OPTS="-DBITE=1 -DHISTORIC_STATE=1 ${{ inputs.cmake_options }}"
          echo "CMAKE_OPTS=$CMAKE_OPTS" >> $GITHUB_ENV
      - name: Prepare workflow variables (FAIR)
        if: inputs.node_type == 'fair'
        run: |
          export VERSION_SUFFIX=$(echo "$BUILD_TYPE" | tr '[:upper:]' '[:lower:]')
          [[ $PLAIN_VERSION = "true" ]] && export VERSION=${{ inputs.image_version }} || \
            export VERSION=${{ inputs.image_version }}-$VERSION_SUFFIX
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          export CMAKE_OPTS="-DFAIR=1 ${{ inputs.cmake_options }}"
          echo "CMAKE_OPTS=$CMAKE_OPTS" >> $GITHUB_ENV
      - name: Prepare workflow variables (FAIR-HISTORIC)
        if: inputs.node_type == 'fair-historic'
        run: |
          export VERSION_SUFFIX=$(echo "$BUILD_TYPE" | tr '[:upper:]' '[:lower:]')
          [[ $PLAIN_VERSION = "true" ]] && export VERSION=${{ inputs.image_version }} || \
            export VERSION=${{ inputs.image_version }}-$VERSION_SUFFIX
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          export CMAKE_OPTS="-DFAIR=1 -DHISTORIC_STATE=1 ${{ inputs.cmake_options }}"
          echo "CMAKE_OPTS=$CMAKE_OPTS" >> $GITHUB_ENV
      - name: Prepare workflow variables (BITE2)
        if: inputs.node_type == 'bite2'
        run: |
          export VERSION_SUFFIX=$(echo "$BUILD_TYPE" | tr '[:upper:]' '[:lower:]')
          [[ $PLAIN_VERSION = "true" ]] && export VERSION=${{ inputs.image_version }} || \
            export VERSION=${{ inputs.image_version }}-$VERSION_SUFFIX
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          export CMAKE_OPTS="-DBITE2=1 ${{ inputs.cmake_options }}"
          echo "CMAKE_OPTS=$CMAKE_OPTS" >> $GITHUB_ENV
      - name: Prepare workflow variables (BITE2-HISTORIC)
        if: inputs.node_type == 'bite2-historic'
        run: |
          export VERSION_SUFFIX=$(echo "$BUILD_TYPE" | tr '[:upper:]' '[:lower:]')
          [[ $PLAIN_VERSION = "true" ]] && export VERSION=${{ inputs.image_version }} || \
            export VERSION=${{ inputs.image_version }}-$VERSION_SUFFIX
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          export CMAKE_OPTS="-DBITE2=1 -DHISTORIC_STATE=1 ${{ inputs.cmake_options }}"
          echo "CMAKE_OPTS=$CMAKE_OPTS" >> $GITHUB_ENV
      - name: update apt
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test || true 
          sudo apt-get update || true
      - name: install packages
        run: |
          sudo apt-get -y remove libzmq* || true
          sudo apt-get -y install software-properties-common gcc-11 g++-11 || true
  
      - name: Use g++-11 and gcov-11 by default
        run: |
          echo "Updating all needed alternatives"
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 11
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 11
          sudo update-alternatives --install /usr/bin/gcov gcov /usr/bin/gcov-11 11
          sudo update-alternatives --install /usr/bin/gcov-dump gcov-dump /usr/bin/gcov-dump-11 11
          sudo update-alternatives --install /usr/bin/gcov-tool gcov-tool /usr/bin/gcov-tool-11 11
          echo "Checking alternative for gcc"
          which gcc
          gcc --version
          echo "Checking alternative for g++"
          which g++
          g++ --version
          echo "Checking alternative for gcov"
          which gcov
          gcov --version
          echo "Checking alternative for gcov-dump"
          which gcov-dump
          gcov-dump --version
          echo "Checking alternative for gcov-tool"
          which gcov-tool
          gcov-tool --version
  
      - name: Extract repo name
        run: echo ::set-env name=REPOSITORY_NAME::$(echo "$GITHUB_REPOSITORY" | awk -F / '{print $2}')
        shell: bash
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: true
      - name: Extract branch name
        shell: bash
        run: echo "##[set-output name=branch;]$(echo ${GITHUB_REF#refs/heads/})"
        id: extract_branch
      - name: checkout
        uses: actions/checkout@v2
        with:
          ref: ${{ inputs.branch_name }}
      - name: Submodule update
        run: |
          rm -rf ./libconsensus || true
          ls -1
          git submodule update --init --recursive 
  
      - name: Prepare ccache timestamp
        id: ccache_cache_timestamp
        shell: cmake -P {0}
        run: |
          string(TIMESTAMP current_date "%Y-%m-%d-%H;%M;%S" UTC)
          message("::set-output name=timestamp::${current_date}")
      - name: Ccache cache files
        uses: actions/cache@v4.2.0
        with:
          path: .ccache
          key: ${ { matrix.config.name } }-ccache-${ { steps.ccache_cache_timestamp.outputs.timestamp } }
          restore-keys: |
            ${ { matrix.config.name } }-ccache-
      - name: Build dependencies
        run: |
          export CC=gcc-11
          export CXX=g++-11
          export TARGET=all
          export CMAKE_BUILD_TYPE=$BUILD_TYPE
          [[ $CMAKE_BUILD_TYPE = "Debug" ]] && export DEBUG_FLAG=1 || export DEBUG_FLAG=0
          cd deps
          ./clean.sh
          # prepare boost library
          cp ~/skaled_deps_predownloaded/boost_1_87_0.tar.bz2 ../libconsensus/libBLS/deps/boost_1_87_0.tar.bz2
          rm -f ./libwebsockets-from-git.tar.gz
          ./build.sh PARALLEL_COUNT=$(nproc) DEBUG=$DEBUG_FLAG
          cd ..
      - name: Configure all
        env:
          CMAKE_OPTS: ${{ env.CMAKE_OPTS }}
        run: |
          export CC=gcc-11
          export CXX=g++-11
          export TARGET=all
          export CMAKE_BUILD_TYPE=$BUILD_TYPE
          mkdir -p build
          cd build
          cmake -DCMAKE_BUILD_TYPE=$CMAKE_BUILD_TYPE $CMAKE_OPTS ..
          cd ..
      - name: Build all
        run: |
          export CC=gcc-11
          export CXX=g++-11
          export TARGET=all
          export CMAKE_BUILD_TYPE=$BUILD_TYPE
          cd build
          make skaled -j$(nproc)
          if [[ "$BUILD_TYPE" = "Release" ]]; then
              debug_wc=$(objdump -h skaled/skaled | grep -i debug | wc -l)
              sym_wc=$(readelf -s skaled/skaled | wc -l)
              if (( debug_wc != 0 || sym_wc > 10000 )); then
                  exit 1
              fi
          fi
          if [[ "$BUILD_TYPE" = "RelWithDebInfo" ]]; then
              cp skaled/skaled skaled/skaled-debug
              strip --strip-all skaled/skaled
          fi
          cd ..
      - name: Build and publish container
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          cp build/skaled/skaled scripts/skale_build/executable/
          export BRANCH=${{ inputs.branch_name }}
          export RELEASE=true
          bash ./scripts/build_and_publish.sh
  
      - name: Upload skaled binary as artifact
        uses: actions/upload-artifact@v4
        if: inputs.release_url == ''
        with:
          name: skaled-${{ inputs.node_type }}
          path: ./build/skaled/skaled

      - name: Upload skaled binary to Release
        if: inputs.release_url != ''
        uses: actions/upload-release-asset@latest
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ inputs.release_url }}
          asset_path: ./build/skaled/skaled
          asset_name: skaled-${{ inputs.node_type }}
          asset_content_type: application/octet-stream

      - name: Upload debug binary to Release
        if: inputs.release_url != '' && inputs.build_type == 'RelWithDebInfo'
        uses: actions/upload-release-asset@latest
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ inputs.release_url }}
          asset_path: ./build/skaled/skaled-debug
          asset_name: skaled-debug-${{ inputs.node_type }}
          asset_content_type: application/octet-stream