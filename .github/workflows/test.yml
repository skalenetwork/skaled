name: Build and test skaled
on:
  push:
    branches-ignore:
      - 'master'
      - 'beta'
      - 'stable'

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: self-hosted
    env:
        ACTIONS_ALLOW_UNSECURE_COMMANDS: true
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        NO_ULIMIT_CHECK: 1
        NO_NTP_CHECK: 1
        ccache_compress: 'true'
        ccache_compresslevel: 9
        # Centralize these (they were exported repeatedly in many steps)
        CCACHE_PATH: /usr/lib/ccache:/usr/local/opt/ccache/libexec
        TARGET: all
        CMAKE_BUILD_TYPE: Debug

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.9.1
        with:
          access_token: ${{ github.token }}
      - name: Extract repo name
        run: echo ::set-env name=REPOSITORY_NAME::$(echo "$GITHUB_REPOSITORY" | awk -F / '{print $2}')
        shell: bash
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: true
      - name: checkout
        uses: actions/checkout@v2
      - name: Cache apt packages
        uses: actions/cache@v4.2.0
        with:
          path: |
            /var/cache/apt/archives
          key: ${{ runner.os }}-apt-cache
          ttl: 1000000 # purge cache every 1000000 seconds (10 days). This is to pull updated packages
      - name: update apt
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test || true
          sudo apt-get update || true
      - name: install packages
        run: |
          sudo apt-get -y remove libzmq* || true
          sudo apt-get -y install software-properties-common gcc-11 g++-11 || true

      - name: Use g++-11 and gcov-11 by default
        run: |
          echo "Updating all needed alternatives"
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 11
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 11
          sudo update-alternatives --install /usr/bin/gcov gcov /usr/bin/gcov-11 11
          sudo update-alternatives --install /usr/bin/gcov-dump gcov-dump /usr/bin/gcov-dump-11 11
          sudo update-alternatives --install /usr/bin/gcov-tool gcov-tool /usr/bin/gcov-tool-11 11
          echo "Checking alternative for gcc"
          which gcc
          gcc --version
          echo "Checking alternative for g++"
          which g++
          g++ --version
          echo "Checking alternative for gcov"
          which gcov
          gcov --version
          echo "Checking alternative for gcov-dump"
          which gcov-dump
          gcov-dump --version
          echo "Checking alternative for gcov-tool"
          which gcov-tool
          gcov-tool --version

      - name: Get newest lcov
        run: |
          # sudo apt-get install libcapture-tiny-perl
          echo "Removing previous lcov version..."
          sudo apt-get remove lcov || true
          echo "Installing newest lcov version..."
          rm -rf newer_lcov || true
          mkdir newer_lcov
          cd newer_lcov
          git clone https://github.com/linux-test-project/lcov --recursive --recurse-submodules
          cd lcov
          git checkout 92e2121
          sudo make install
          cd ..
          cd ..
          echo "Checking installed lcov version..."
          which lcov
          lcov --version

      - name: Submodule update
        run: |
          rm -rf ./libconsensus || true
          ls -1
          git submodule update --init --recursive

      - name: Prepare ccache timestamp
        id: ccache_cache_timestamp
        shell: cmake -P {0}
        run: |
          string(TIMESTAMP current_date "%Y-%m-%d-%H;%M;%S" UTC)
          message("::set-output name=timestamp::${current_date}")
      - name: Ccache cache files
        uses: actions/cache@v4.2.0
        with:
          path: .ccache
          key: ${ { matrix.config.name } }-ccache-${ { steps.ccache_cache_timestamp.outputs.timestamp } }
          restore-keys: |
            ${ { matrix.config.name } }-ccache-
      - name: Update gcc-11
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 11
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 11
      - name: Configure ccache cache size, zero ccache counters and print ccache stats before start
        run: |
          ccache --max-size=15G
          ccache -z
          ccache --show-stats
      - name: Build dependencies
        run: |
          export PATH="$CCACHE_PATH:$PATH"
          cd deps
          #######################################./clean.sh
          # prepare boost library
          cp ~/skaled_deps_predownloaded/boost_1_87_0.tar.bz2 ../libconsensus/libBLS/deps/boost_1_87_0.tar.bz2
          rm -f ./libwebsockets-from-git.tar.gz
          ./build.sh DEBUG=1 PARALLEL_COUNT=$(nproc)
          cd ..

      - name: Configure all
        run: |
          export PATH="$CCACHE_PATH:$PATH"
          mkdir -p build
          cd build
          cmake -DCMAKE_BUILD_TYPE="$CMAKE_BUILD_TYPE" -DCOVERAGE="$CODE_COVERAGE" ..
          cd ..
      - name: Print ccache stats for deps
        run: |
          ccache --show-stats
      - name: Build all
        run: |
          export PATH="$CCACHE_PATH:$PATH"
          cd build
          make testeth -j"$(nproc)"
          cd ..

      # ----------------------
      # Reusable test step bodies (default/FAIR/BITE2 share the same suite list)
      # ----------------------
      - &testeth_v1_all
        name: Testeth verbosity 1
        env:
          BUILD_DIR: build
        run: |
          set -euo pipefail
          echo "======= RUNNING TESTS ($BUILD_DIR) ======="
          mkdir -p /tmp/tests/
          sudo rm -rf /tmp/tests/*
          cd "$BUILD_DIR/test"

          TEST_SUITES=(
            TransitionTests TransactionTests VMTests LevelDBTests CoreLibTests RlpTests SharedSpaceTests
            EthashTests SealEngineTests DifficultyTests BlockSuite BlockChainMainNetworkSuite
            BlockChainFrontierSuite BlockQueueSuite ClientBase EstimateGas getHistoricNodesData
            ExtVmSuite GasPricer BasicTests InstanceMonitorSuite PrecompiledTests SkaleHostSuite
            StateUnitTests libethereum TransactionQueueSuite LegacyVMSuite SkaleInterpreterSuite
            SnapshotSigningTestSuite SkUtils BlockChainTestSuite TestHelperSuite LevelDBHashBase
            memDB OverlayDBTests AccountHolderTest ClientTests JsonRpcSuite SingleConsensusTests ConsensusTests
          )

          run_test() { ./testeth --report_level=detailed -t "$1" -- --express && touch "/tmp/tests/${1}Passed" || true; }
          for s in "${TEST_SUITES[@]}"; do run_test "$s"; done

          run_sudo_all() {
            sudo NO_ULIMIT_CHECK="$NO_ULIMIT_CHECK" NO_NTP_CHECK="$NO_NTP_CHECK" ./testeth -t "$1" -- --all \
              && touch "/tmp/tests/${1}Passed" || true
          }
          run_sudo_all BtrfsTestSuite
          run_sudo_all HashSnapshotTestSuite
          run_sudo_all ClientSnapshotsSuite

          cd ../..

      - &testeth_v4_all
        name: Testeth verbosity 4
        env:
          BUILD_DIR: build
        run: |
          set -euo pipefail
          echo "======= RUNNING TESTS VERBOSITY ($BUILD_DIR) ======="
          cd "$BUILD_DIR/test"

          TEST_SUITES=(
            TransitionTests TransactionTests VMTests LevelDBTests CoreLibTests RlpTests SharedSpaceTests
            EthashTests SealEngineTests DifficultyTests BlockSuite BlockChainMainNetworkSuite
            BlockChainFrontierSuite BlockQueueSuite ClientBase EstimateGas getHistoricNodesData
            ExtVmSuite GasPricer BasicTests InstanceMonitorSuite PrecompiledTests SkaleHostSuite
            StateUnitTests libethereum TransactionQueueSuite LegacyVMSuite SkaleInterpreterSuite
            SnapshotSigningTestSuite SkUtils BlockChainTestSuite TestHelperSuite LevelDBHashBase
            memDB OverlayDBTests AccountHolderTest ClientTests JsonRpcSuite SingleConsensusTests ConsensusTests
          )

          rerun_test() { ls "/tmp/tests/${1}Passed" 2>/dev/null || ./testeth --report_level=detailed -t "$1" -- --express --verbosity 4; }
          for s in "${TEST_SUITES[@]}"; do rerun_test "$s"; done

          rerun_sudo_all() {
            ls "/tmp/tests/${1}Passed" 2>/dev/null || sudo NO_ULIMIT_CHECK="$NO_ULIMIT_CHECK" NO_NTP_CHECK="$NO_NTP_CHECK" \
              ./testeth -t "$1" -- --all --verbosity 4
          }
          rerun_sudo_all BtrfsTestSuite
          rerun_sudo_all HashSnapshotTestSuite
          rerun_sudo_all ClientSnapshotsSuite

          cd ../..

      - name: Print ccache stats after full build
        run : |
          ccache --show-stats
      # first run with verbosity 1. If test fails, rerun with verbosity 4
      # we specifically run each test for easier log review
      - <<: *testeth_v1_all
        name: Testeth verbosity 1
        env:
          BUILD_DIR: build

      - <<: *testeth_v4_all
        name: Testeth verbosity 4
        env:
          BUILD_DIR: build

      - name: Configure all as historic
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          export TARGET=all
          export CMAKE_BUILD_TYPE=Debug
          mkdir -p build_historic
          cd build_historic
          # -DCMAKE_C_FLAGS=-O3 -DCMAKE_CXX_FLAGS=-O3
          cmake -DCMAKE_BUILD_TYPE=$CMAKE_BUILD_TYPE -DCOVERAGE=$CODE_COVERAGE -DHISTORIC_STATE=1 ..
          cd ..
      - name: Build all historic
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          export TARGET=all
          export CMAKE_BUILD_TYPE=Debug
          cd build_historic
          make testeth -j$(nproc)          
          cd ..
      - name: Print ccache stats after full historic build
        run : |
          ccache --show-stats
      - name: Testeth historic verbosity 1
        run : |
          echo "======= RUNNING HISTORIC TESTS ======="
          mkdir -p /tmp/tests/
          sudo rm -rf /tmp/tests/*
          cd build_historic/test
          ./testeth -t JsonRpcSuite -- --express && touch /tmp/tests/JsonRpcSuitePassed || true
      - name: Testeth historic verbosity 4
        run : |
          echo "======= RUNNING HISTORIC TESTS VERBOSITY ======="
          cd build_historic/test
          ls /tmp/tests/JsonRpcSuitePassed || ./testeth -t JsonRpcSuite -- --express --verbosity 4
      
      - name: Configure all FAIR
        run: |
          export PATH="$CCACHE_PATH:$PATH"
          mkdir -p build_fair
          cd build_fair
          cmake -DCMAKE_BUILD_TYPE="$CMAKE_BUILD_TYPE" -DCOVERAGE="$CODE_COVERAGE" -DFAIR=1 ..
          cd ..
      - name: Build all FAIR
        run: |
          export PATH="$CCACHE_PATH:$PATH"
          cd build_fair
          make testeth -j"$(nproc)"
          cd ..

      - <<: *testeth_v1_all
        name: Testeth FAIR verbosity 1
        env:
          BUILD_DIR: build_fair

      - <<: *testeth_v4_all
        name: Testeth FAIR verbosity 4
        env:
          BUILD_DIR: build_fair

      - name: Configure all BITE2
        run: |
          export PATH="$CCACHE_PATH:$PATH"
          mkdir -p build_bite2
          cd build_bite2
          cmake -DCMAKE_BUILD_TYPE="$CMAKE_BUILD_TYPE" -DCOVERAGE="$CODE_COVERAGE" -DBITE2=1 ..
          cd ..
      - name: Build all BITE2
        run: |
          export PATH="$CCACHE_PATH:$PATH"
          cd build_bite2
          make testeth -j"$(nproc)"
          cd ..

      - <<: *testeth_v1_all
        name: Testeth BITE2 verbosity 1
        env:
          BUILD_DIR: build_bite2

      - <<: *testeth_v4_all
        name: Testeth BITE2 verbosity 4
        env:
          BUILD_DIR: build_bite2
