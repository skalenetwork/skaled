name: Build and test skaled
on:
  push:
    branches-ignore:
      - 'master'
      - 'beta'
      - 'stable'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NO_ULIMIT_CHECK: 1
  NO_NTP_CHECK: 1
  TARGET: all
  CMAKE_BUILD_TYPE: Debug

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    # Backstop so a hung test can't ride GitHub's 6h default and stall the queue.
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Default
            build_dir: build
            cmake_args: ""
            mode: full

          - name: Default-historic
            build_dir: build
            cmake_args: "-DHISTORIC_STATE=1"
            mode: historic

          - name: FAIR
            build_dir: build
            cmake_args: "-DFAIR=1"
            mode: full
            bite2_suites: "true"

          - name: FAIR-historic
            build_dir: build
            cmake_args: "-DFAIR=1 -DHISTORIC_STATE=1"
            mode: historic

          - name: BITE
            build_dir: build
            cmake_args: "-DBITE=1"
            mode: full
            bite2_suites: "true"

          - name: BITE-historic
            build_dir: build
            cmake_args: "-DBITE=1 -DHISTORIC_STATE=1"
            mode: historic
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libunwind-dev autoconf build-essential cmake libprocps-dev libtool texinfo wget yasm flex bison btrfs-progs python3 python3-pip gawk git vim doxygen
          sudo apt-get install -y make pkg-config libgnutls28-dev libssl-dev unzip zlib1g-dev libgcrypt20-dev gcc-11 g++-11 gperf clang-format-11 gnutls-dev
          sudo apt-get install -y nettle-dev libhiredis-dev redis-server google-perftools libgoogle-perftools-dev lcov libv8-dev
          sudo apt-get install -y gettext

          # Remove deps installed in the next steps
          sudo apt-get purge -y libbz2-dev liblz4-dev

      - name: Set gcc
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 11
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 11
          sudo update-alternatives --install /usr/bin/gcov gcov /usr/bin/gcov-11 11
          sudo update-alternatives --install /usr/bin/gcov-dump gcov-dump /usr/bin/gcov-dump-11 11
          sudo update-alternatives --install /usr/bin/gcov-tool gcov-tool /usr/bin/gcov-tool-11 11
          gcc --version

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h

      - name: Build dependencies
        run: |
          cd deps
          ./build.sh DEBUG=1 PARALLEL_COUNT=$(nproc)
          cd ..

      - name: Build (${{ matrix.name }})
        uses: ./.github/actions/cmake-build
        with:
          build_dir: ${{ matrix.build_dir }}
          cmake_build_type: ${{ env.CMAKE_BUILD_TYPE }}
          cmake_args: ${{ matrix.cmake_args }}
          make_target: testeth

      - name: Testeth verbosity 1
        uses: ./.github/actions/testeth-run
        with:
          build_dir: ${{ matrix.build_dir }}
          mode: ${{ matrix.mode }}
          verbosity: "1"
          bite2_suites: ${{ matrix.bite2_suites || 'false' }}

      - name: Testeth verbosity 4
        uses: ./.github/actions/testeth-run
        with:
          build_dir: ${{ matrix.build_dir }}
          mode: ${{ matrix.mode }}
          verbosity: "4"
          bite2_suites: ${{ matrix.bite2_suites || 'false' }}
